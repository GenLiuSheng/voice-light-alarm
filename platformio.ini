; PlatformIO 工程配置 —— ESP32-S3 N16R8
; 等待硬件到货期间先把骨架建好，板到后直接填充模块逻辑。
; 注意：ESP32-S3 为 3.3V IO，WS2812 数据线需电平转换（见 docs/预研计划.md R1）

[platformio]
; 关闭 safe-delete：Windows 沙箱无回收站会导致构建缓存清理失败（[FAILED] safe-delete）
enable_safe_delete = no

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16MB Flash + 8MB PSRAM
board_build.flash_size = 16MB
board_build.psram = enable

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit SSD1306 @ ^2.5.0
    adafruit/Adafruit GFX Library @ ^1.11.0
    northernwidget/DS3231 @ ^1.2.0

build_flags =
    -D CORE_DEBUG_LEVEL=3
