; M1 例程 01：Blink（板到第一天第一件事）
; 目标：验证 烧录链路 + 串口 + GPIO 输出
; 用法：pio run -t upload && pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16MB Flash + 8MB PSRAM（例程用不到，但保持与主工程一致）
board_build.flash_size = 16MB
board_build.psram = enable

monitor_speed = 115200
upload_speed = 921600
